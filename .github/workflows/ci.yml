name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    name: 🧪 Server tests
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json

      # Testcontainers starts PostgreSQL using the runner's Docker daemon.
      - name: 🔬 Run integration tests
        run: dotnet test server/RoomBooking.sln --configuration Release --logger "console;verbosity=normal"

  client:
    runs-on: ubuntu-latest
    name: 🎨 Client lint, tests, and build
    defaults:
      run:
        working-directory: client
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🛠️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Lint
        run: pnpm lint

      - name: 🧪 Test
        run: pnpm test

      - name: 🏗️ Build
        run: pnpm build
