# Local PostgreSQL for development. The API and frontend run directly on the host (see README).
services:
  db:
    image: postgres:17-alpine
    container_name: room-booking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: room_booking
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d room_booking"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pg_data:
